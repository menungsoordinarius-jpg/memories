<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory Box Grup</title>
<style>
  :root {
    --bg: #2f4858;
    --bg-deep: #243946;
    --paper: #fbfaf7;
    --ink: #1f2a30;
    --soft: #5d6b73;
    --accent: #e8b04a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: Georgia, 'Times New Roman', serif;
    padding: 20px 16px 60px;
    min-height: 100vh;
  }
  .wrap { max-width: 520px; margin: 0 auto; }
  h1 { color: var(--paper); font-size: 30px; font-weight: 700; letter-spacing: -0.5px; margin: 8px 0 4px; }
  .sub { color: #b9c7cf; font-size: 15px; margin-bottom: 22px; line-height: 1.5; }

  .box {
    background: var(--bg-deep);
    border: 2px dashed #56707f;
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 18px;
  }
  .hidden { display: none !important; }
  .box p { color: #d7e0e5; font-size: 15px; line-height: 1.5; margin-bottom: 14px; }
  .box label { display: block; color: #d7e0e5; font-size: 14px; margin-bottom: 6px; }

  .field {
    width: 100%; padding: 12px; margin-bottom: 14px;
    border: 1px solid #56707f; border-radius: 8px;
    background: #fff; color: var(--ink);
    font-size: 16px; font-family: inherit;
  }
  textarea.field { resize: vertical; min-height: 80px; }
  input[type=file].field { background: #f1f4f6; font-size: 14px; }
  .preview { display: none; width: 100%; max-height: 220px; object-fit: cover; border-radius: 8px; margin-bottom: 14px; }

  .btn {
    width: 100%; padding: 14px; border: none; border-radius: 8px;
    background: var(--accent); color: #2a2008;
    font-size: 16px; font-weight: 700; font-family: inherit; cursor: pointer;
  }
  .btn:disabled { opacity: .6; cursor: wait; }
  .btn.google { background: #fff; color: #1f2a30; border: 1px solid #c9d3d9; }
  .btn:focus-visible, .field:focus-visible, .mini:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

  .userbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .userbar span { color: #d7e0e5; font-size: 14px; word-break: break-all; }
  .mini {
    padding: 8px 12px; border: 1px solid #56707f; border-radius: 6px;
    background: transparent; color: #d7e0e5;
    font-size: 13px; font-family: system-ui, sans-serif; cursor: pointer; flex-shrink: 0;
  }
  .polaroid .mini { color: var(--ink); border-color: #c9c5b8; }
  .polaroid .mini.danger { color: #8a1c14; border-color: #e1b3af; }
  .polaroid .mini.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  .mini:disabled { opacity: .6; }

  #status {
    margin-bottom: 18px; padding: 10px 12px; border-radius: 8px;
    font-size: 14px; line-height: 1.45; word-break: break-word;
    display: none; font-family: system-ui, sans-serif;
  }
  #status.info { display: block; background: #dbe7ee; color: #1d3340; }
  #status.ok   { display: block; background: #d8efe0; color: #14532d; }
  #status.err  { display: block; background: #fbdedc; color: #7a1410; }

  .feed { display: flex; flex-direction: column; gap: 26px; margin-top: 30px; }
  .polaroid {
    background: var(--paper); padding: 12px 12px 16px; border-radius: 3px;
    box-shadow: 0 8px 18px rgba(0,0,0,.28);
  }
  .polaroid:nth-child(odd)  { transform: rotate(-1deg); }
  .polaroid:nth-child(even) { transform: rotate(1deg); }
  .polaroid img.photo {
    width: 100%; height: auto; max-height: 460px; object-fit: cover;
    display: block; background: #e6e3da;
  }
  .caption { padding: 14px 4px 0; }
  .author { font-weight: 700; font-size: 17px; margin-bottom: 4px; }
  .text { font-size: 15px; line-height: 1.55; color: var(--soft); white-space: pre-wrap; word-break: break-word; }
  .actions { display: flex; gap: 8px; margin-top: 14px; align-items: center; flex-wrap: wrap; }
  .confirm { font-size: 14px; font-family: system-ui, sans-serif; color: #8a1c14; }
  .caption .field { margin-bottom: 10px; border-color: #c9c5b8; }
  .empty { text-align: center; color: #b9c7cf; padding: 24px 0; font-size: 15px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Memory Box</h1>
  <p class="sub">Tempel foto dan cerita kenangan grup di sini. Semua orang bisa melihat, yang masuk dengan Google bisa menambah.</p>

  <!-- Belum masuk -->
  <div id="loggedOut" class="box">
    <p>Masuk dengan akun Google untuk menambah kenangan.</p>
    <button type="button" id="loginBtn" class="btn google">Masuk dengan Google</button>
  </div>

  <!-- Sudah masuk -->
  <div id="loggedIn" class="box hidden">
    <div class="userbar">
      <span id="userLabel"></span>
      <button type="button" id="logoutBtn" class="mini">Keluar</button>
    </div>

    <label for="nameInput">Nama tampilan</label>
    <input type="text" id="nameInput" class="field" maxlength="60" autocomplete="name">

    <label for="captionInput">Cerita kenangan</label>
    <textarea id="captionInput" class="field" maxlength="500"></textarea>

    <label for="imageInput">Foto</label>
    <input type="file" id="imageInput" class="field" accept="image/*">
    <img id="preview" class="preview" alt="Pratinjau foto">

    <button type="button" id="submitBtn" class="btn">Tempel ke dinding</button>
  </div>

  <div id="status" role="status"></div>

  <div id="feed" class="feed">
    <div class="empty">Memuat kenangan...</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ===== Konfigurasi Supabase =====
  const SUPABASE_URL = 'https://pypfrxsrrcgzpcfhmzhi.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB5cGZyeHNycmNnenBjZmhtemhpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwNDg1OTcsImV4cCI6MjEwNzYyNDU5N30.L2KwHz_pD69TFNEE1eErB0hri2V0XFbFLUl9y7qgDBU';
  const BUCKET = 'photos';
  const TABLE = 'memories';

  const $ = (id) => document.getElementById(id);
  const statusEl = $('status');
  const feedEl = $('feed');
  const submitBtn = $('submitBtn');
  const imageInput = $('imageInput');
  const previewEl = $('preview');

  let db = null;
  let me = null; // user yang sedang masuk (atau null)

  function setStatus(type, msg) {
    statusEl.className = type || '';
    statusEl.textContent = msg || '';
  }

  // ===== Inisialisasi Supabase =====
  try {
    if (!window.supabase || !window.supabase.createClient) {
      throw new Error('Library Supabase gagal dimuat. Cek koneksi internet lalu muat ulang halaman.');
    }
    db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  } catch (e) {
    setStatus('err', e.message);
    feedEl.innerHTML = '';
  }

  // ===== Login / logout =====
  function setUser(user) {
    me = user || null;
    $('loggedOut').classList.toggle('hidden', !!me);
    $('loggedIn').classList.toggle('hidden', !me);
    if (me) {
      const meta = me.user_metadata || {};
      $('userLabel').textContent = 'Masuk sebagai ' + (me.email || meta.full_name || 'pengguna');
      if (!$('nameInput').value) $('nameInput').value = meta.full_name || meta.name || '';
    }
  }

  $('loginBtn').addEventListener('click', async () => {
    if (!db) return;
    setStatus('info', 'Membuka halaman Google...');
    const { error } = await db.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: window.location.origin + window.location.pathname }
    });
    if (error) setStatus('err', 'Gagal masuk: ' + error.message);
  });

  $('logoutBtn').addEventListener('click', async () => {
    if (!db) return;
    await db.auth.signOut();
    setStatus('', '');
  });

  if (db) {
    db.auth.getSession().then(({ data }) => {
      setUser(data.session ? data.session.user : null);
      loadMemories();
    });
    db.auth.onAuthStateChange((_event, session) => {
      const u = session ? session.user : null;
      if ((u && u.id) !== (me && me.id)) {
        setUser(u);
        loadMemories();
      }
    });
  }

  // ===== Pratinjau & kompres foto =====
  imageInput.addEventListener('change', () => {
    const f = imageInput.files[0];
    if (!f) { previewEl.style.display = 'none'; return; }
    previewEl.src = URL.createObjectURL(f);
    previewEl.style.display = 'block';
  });

  function compressImage(file) {
    return new Promise((resolve) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        try {
          const MAX = 1600;
          const scale = Math.min(1, MAX / Math.max(img.width, img.height));
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          canvas.toBlob((blob) => { URL.revokeObjectURL(url); resolve(blob || file); }, 'image/jpeg', 0.85);
        } catch (e) { resolve(file); }
      };
      img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
      img.src = url;
    });
  }

  // ===== Upload kenangan baru =====
  async function uploadMemory() {
    if (!db || !me) { setStatus('err', 'Masuk dengan Google dulu.'); return; }

    const name = $('nameInput').value.trim();
    const caption = $('captionInput').value.trim();
    const file = imageInput.files[0];

    if (!name || !caption || !file) {
      setStatus('err', 'Isi nama, cerita, dan pilih foto dulu.');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Mengunggah...';
    setStatus('info', 'Memperkecil foto...');

    try {
      const blob = await compressImage(file);
      // Foto disimpan di folder milik user, dipakai oleh policy storage
      const path = me.id + '/' + Date.now() + '_' + Math.random().toString(36).slice(2, 8) + '.jpg';

      setStatus('info', 'Mengunggah foto...');
      const { error: upErr } = await db.storage.from(BUCKET)
        .upload(path, blob, { contentType: blob.type || 'image/jpeg' });
      if (upErr) throw new Error('Upload foto: ' + upErr.message);

      const { data: urlData } = db.storage.from(BUCKET).getPublicUrl(path);

      setStatus('info', 'Menyimpan cerita...');
      const { error: dbErr } = await db.from(TABLE)
        .insert([{ name: name, caption: caption, image_url: urlData.publicUrl, user_id: me.id }]);
      if (dbErr) throw new Error('Simpan data: ' + dbErr.message);

      setStatus('ok', 'Berhasil. Kenanganmu sudah tampil di dinding.');
      $('captionInput').value = '';
      imageInput.value = '';
      previewEl.style.display = 'none';
      await loadMemories();
    } catch (err) {
      console.error(err);
      setStatus('err', 'Gagal: ' + (err.message || JSON.stringify(err)));
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Tempel ke dinding';
    }
  }
  submitBtn.addEventListener('click', uploadMemory);

  // ===== Tampilkan feed =====
  function safeUrl(u) { return /^https?:\/\//i.test(u || '') ? u : ''; }

  function storagePathFromUrl(url) {
    const marker = '/object/public/' + BUCKET + '/';
    const i = (url || '').indexOf(marker);
    return i === -1 ? null : decodeURIComponent(url.slice(i + marker.length).split('?')[0]);
  }

  function mini(label, cls, onClick) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'mini' + (cls ? ' ' + cls : '');
    b.textContent = label;
    b.addEventListener('click', onClick);
    return b;
  }

  function buildCard(item) {
    const card = document.createElement('div');
    card.className = 'polaroid';

    const img = document.createElement('img');
    img.className = 'photo';
    img.src = safeUrl(item.image_url);
    img.alt = 'Foto kenangan dari ' + (item.name || '');
    img.loading = 'lazy';

    const cap = document.createElement('div');
    cap.className = 'caption';

    card.appendChild(img);
    card.appendChild(cap);

    const isMine = !!(me && item.user_id && item.user_id === me.id);

    function showView() {
      cap.innerHTML = '';
      const author = document.createElement('div');
      author.className = 'author';
      author.textContent = item.name || '';
      const text = document.createElement('div');
      text.className = 'text';
      text.textContent = item.caption || '';
      cap.appendChild(author);
      cap.appendChild(text);

      if (isMine) {
        const actions = document.createElement('div');
        actions.className = 'actions';
        actions.appendChild(mini('Edit', '', showEdit));
        actions.appendChild(mini('Hapus', 'danger', showConfirm));
        cap.appendChild(actions);
      }
    }

    function showEdit() {
      cap.innerHTML = '';
      const nameIn = document.createElement('input');
      nameIn.className = 'field';
      nameIn.maxLength = 60;
      nameIn.value = item.name || '';
      const capIn = document.createElement('textarea');
      capIn.className = 'field';
      capIn.maxLength = 500;
      capIn.value = item.caption || '';

      const actions = document.createElement('div');
      actions.className = 'actions';
      const saveBtn = mini('Simpan', 'primary', async () => {
        const n = nameIn.value.trim();
        const c = capIn.value.trim();
        if (!n || !c) { setStatus('err', 'Nama dan cerita tidak boleh kosong.'); return; }
        saveBtn.disabled = true;
        saveBtn.textContent = 'Menyimpan...';
        const { data, error } = await db.from(TABLE)
          .update({ name: n, caption: c })
          .eq('id', item.id)
          .select();
        if (error || !data || data.length === 0) {
          setStatus('err', 'Gagal menyimpan: ' + (error ? error.message : 'tidak ada izin untuk mengubah data ini.'));
          saveBtn.disabled = false;
          saveBtn.textContent = 'Simpan';
          return;
        }
        item.name = n;
        item.caption = c;
        setStatus('ok', 'Perubahan tersimpan.');
        showView();
      });
      actions.appendChild(saveBtn);
      actions.appendChild(mini('Batal', '', showView));

      cap.appendChild(nameIn);
      cap.appendChild(capIn);
      cap.appendChild(actions);
    }

    function showConfirm() {
      cap.querySelector('.actions').remove();
      const actions = document.createElement('div');
      actions.className = 'actions';
      const q = document.createElement('span');
      q.className = 'confirm';
      q.textContent = 'Hapus kenangan ini?';
      const yes = mini('Ya, hapus', 'danger', async () => {
        yes.disabled = true;
        yes.textContent = 'Menghapus...';
        const { data, error } = await db.from(TABLE).delete().eq('id', item.id).select();
        if (error || !data || data.length === 0) {
          setStatus('err', 'Gagal menghapus: ' + (error ? error.message : 'tidak ada izin untuk menghapus data ini.'));
          showView();
          return;
        }
        const path = storagePathFromUrl(item.image_url);
        if (path) await db.storage.from(BUCKET).remove([path]);
        setStatus('ok', 'Kenangan dihapus.');
        card.remove();
        if (!feedEl.children.length) renderEmpty('Belum ada kenangan. Jadilah yang pertama menempel foto.');
      });
      actions.appendChild(q);
      actions.appendChild(yes);
      actions.appendChild(mini('Batal', '', showView));
      cap.appendChild(actions);
    }

    showView();
    return card;
  }

  function renderEmpty(msg) {
    feedEl.innerHTML = '';
    const d = document.createElement('div');
    d.className = 'empty';
    d.textContent = msg;
    feedEl.appendChild(d);
  }

  async function loadMemories() {
    if (!db) return;
    const { data, error } = await db.from(TABLE).select('*').order('id', { ascending: false });

    if (error) { renderEmpty('Gagal memuat data: ' + error.message); return; }
    if (!data || data.length === 0) {
      renderEmpty('Belum ada kenangan. Jadilah yang pertama menempel foto.');
      return;
    }

    feedEl.innerHTML = '';
    const frag = document.createDocumentFragment();
    data.forEach((item) => frag.appendChild(buildCard(item)));
    feedEl.appendChild(frag);
  }
</script>
</body>
</html>
