<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory Box Grup</title>
<style>
  :root {
    --bg: #2f4858;
    --bg-deep: #243946;
    --paper: #fbfaf7;
    --ink: #1f2a30;
    --soft: #5d6b73;
    --accent: #e8b04a;
    --ok: #2e7d4f;
    --err: #b3261e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: Georgia, 'Times New Roman', serif;
    padding: 20px 16px 60px;
    min-height: 100vh;
  }
  .wrap { max-width: 520px; margin: 0 auto; }

  h1 {
    color: var(--paper);
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin: 8px 0 4px;
  }
  .sub { color: #b9c7cf; font-size: 15px; margin-bottom: 22px; line-height: 1.5; }

  .form {
    background: var(--bg-deep);
    border: 2px dashed #56707f;
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 30px;
  }
  .form label { display: block; color: #d7e0e5; font-size: 14px; margin-bottom: 6px; }
  .field {
    width: 100%;
    padding: 12px;
    margin-bottom: 14px;
    border: 1px solid #56707f;
    border-radius: 8px;
    background: #fff;
    color: var(--ink);
    font-size: 16px; /* 16px mencegah zoom otomatis di HP */
    font-family: inherit;
  }
  textarea.field { resize: vertical; min-height: 80px; }
  input[type=file].field { background: #f1f4f6; font-size: 14px; }

  .preview { display: none; width: 100%; max-height: 220px; object-fit: cover; border-radius: 8px; margin-bottom: 14px; }

  button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #2a2008;
    font-size: 16px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: wait; }
  button:focus-visible, .field:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

  #status {
    margin-top: 12px;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.45;
    word-break: break-word;
    display: none;
    font-family: system-ui, sans-serif;
  }
  #status.info { display: block; background: #dbe7ee; color: #1d3340; }
  #status.ok   { display: block; background: #d8efe0; color: #14532d; }
  #status.err  { display: block; background: #fbdedc; color: #7a1410; }

  /* Feed: kartu seperti foto polaroid */
  .feed { display: flex; flex-direction: column; gap: 26px; }
  .polaroid {
    background: var(--paper);
    padding: 12px 12px 16px;
    border-radius: 3px;
    box-shadow: 0 8px 18px rgba(0,0,0,.28);
  }
  .polaroid:nth-child(odd)  { transform: rotate(-1deg); }
  .polaroid:nth-child(even) { transform: rotate(1deg); }
  .polaroid img {
    width: 100%;
    height: auto;
    max-height: 460px;
    object-fit: cover;
    display: block;
    background: #e6e3da;
  }
  .caption { padding: 14px 4px 0; }
  .author { font-weight: 700; font-size: 17px; margin-bottom: 4px; }
  .text { font-size: 15px; line-height: 1.55; color: var(--soft); white-space: pre-wrap; word-break: break-word; }

  .empty { text-align: center; color: #b9c7cf; padding: 24px 0; font-size: 15px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Memory Box</h1>
  <p class="sub">Tempel foto dan cerita kenangan grup di sini.</p>

  <div class="form">
    <label for="nameInput">Nama kamu</label>
    <input type="text" id="nameInput" class="field" maxlength="60" autocomplete="name">

    <label for="captionInput">Cerita kenangan</label>
    <textarea id="captionInput" class="field" maxlength="500"></textarea>

    <label for="imageInput">Foto</label>
    <input type="file" id="imageInput" class="field" accept="image/*">
    <img id="preview" class="preview" alt="Pratinjau foto">

    <button type="button" id="submitBtn">Tempel ke dinding</button>
    <div id="status" role="status"></div>
  </div>

  <div id="feed" class="feed">
    <div class="empty">Memuat kenangan...</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ===== Konfigurasi Supabase =====
  const SUPABASE_URL = 'https://pypfrxsrrcgzpcfhmzhi.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB5cGZyeHNycmNnenBjZmhtemhpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwNDg1OTcsImV4cCI6MjEwNzYyNDU5N30.L2KwHz_pD69TFNEE1eErB0hri2V0XFbFLUl9y7qgDBU';
  const BUCKET = 'photos';
  const TABLE = 'memories';

  const $ = (id) => document.getElementById(id);
  const statusEl = $('status');
  const feedEl = $('feed');
  const btn = $('submitBtn');
  const imageInput = $('imageInput');
  const previewEl = $('preview');

  function setStatus(type, msg) {
    statusEl.className = type;
    statusEl.textContent = msg;
  }

  // Cek apakah library Supabase berhasil dimuat
  let db = null;
  try {
    if (!window.supabase || !window.supabase.createClient) {
      throw new Error('Library Supabase gagal dimuat. Cek koneksi internet lalu muat ulang halaman.');
    }
    db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  } catch (e) {
    setStatus('err', e.message);
    feedEl.innerHTML = '';
  }

  // Pratinjau foto yang dipilih
  imageInput.addEventListener('change', () => {
    const f = imageInput.files[0];
    if (!f) { previewEl.style.display = 'none'; return; }
    previewEl.src = URL.createObjectURL(f);
    previewEl.style.display = 'block';
  });

  // Perkecil foto agar upload cepat di HP (maks 1600px, JPEG)
  function compressImage(file) {
    return new Promise((resolve) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        try {
          const MAX = 1600;
          const scale = Math.min(1, MAX / Math.max(img.width, img.height));
          const w = Math.round(img.width * scale);
          const h = Math.round(img.height * scale);
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          canvas.toBlob((blob) => {
            URL.revokeObjectURL(url);
            resolve(blob || file);
          }, 'image/jpeg', 0.85);
        } catch (e) {
          resolve(file);
        }
      };
      img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
      img.src = url;
    });
  }

  async function uploadMemory() {
    if (!db) { setStatus('err', 'Supabase belum siap. Muat ulang halaman.'); return; }

    const name = $('nameInput').value.trim();
    const caption = $('captionInput').value.trim();
    const file = imageInput.files[0];

    if (!name || !caption || !file) {
      setStatus('err', 'Isi nama, cerita, dan pilih foto dulu.');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Mengunggah...';
    setStatus('info', 'Memperkecil foto...');

    try {
      const blob = await compressImage(file);
      const fileName = Date.now() + '_' + Math.random().toString(36).slice(2, 8) + '.jpg';

      setStatus('info', 'Mengunggah foto...');
      const { error: uploadError } = await db.storage
        .from(BUCKET)
        .upload(fileName, blob, { contentType: blob.type || 'image/jpeg' });
      if (uploadError) throw new Error('Upload foto: ' + uploadError.message);

      const { data: urlData } = db.storage.from(BUCKET).getPublicUrl(fileName);

      setStatus('info', 'Menyimpan cerita...');
      const { error: dbError } = await db
        .from(TABLE)
        .insert([{ name: name, caption: caption, image_url: urlData.publicUrl }]);
      if (dbError) throw new Error('Simpan data: ' + dbError.message);

      setStatus('ok', 'Berhasil. Kenanganmu sudah tampil di dinding.');
      $('nameInput').value = '';
      $('captionInput').value = '';
      imageInput.value = '';
      previewEl.style.display = 'none';
      await loadMemories();
    } catch (err) {
      console.error(err);
      setStatus('err', 'Gagal: ' + (err.message || JSON.stringify(err)));
    } finally {
      btn.disabled = false;
      btn.textContent = 'Tempel ke dinding';
    }
  }

  function safeUrl(u) {
    return /^https?:\/\//i.test(u || '') ? u : '';
  }

  async function loadMemories() {
    if (!db) return;
    const { data, error } = await db
      .from(TABLE)
      .select('*')
      .order('id', { ascending: false });

    feedEl.innerHTML = '';

    if (error) {
      const d = document.createElement('div');
      d.className = 'empty';
      d.textContent = 'Gagal memuat data: ' + error.message;
      feedEl.appendChild(d);
      return;
    }

    if (!data || data.length === 0) {
      const d = document.createElement('div');
      d.className = 'empty';
      d.textContent = 'Belum ada kenangan. Jadilah yang pertama menempel foto.';
      feedEl.appendChild(d);
      return;
    }

    const frag = document.createDocumentFragment();
    data.forEach((item) => {
      const card = document.createElement('div');
      card.className = 'polaroid';

      const img = document.createElement('img');
      img.src = safeUrl(item.image_url);
      img.alt = 'Foto kenangan dari ' + (item.name || '');
      img.loading = 'lazy';

      const cap = document.createElement('div');
      cap.className = 'caption';

      const author = document.createElement('div');
      author.className = 'author';
      author.textContent = item.name || '';

      const text = document.createElement('div');
      text.className = 'text';
      text.textContent = item.caption || '';

      cap.appendChild(author);
      cap.appendChild(text);
      card.appendChild(img);
      card.appendChild(cap);
      frag.appendChild(card);
    });
    feedEl.appendChild(frag);
  }

  btn.addEventListener('click', uploadMemory);
  loadMemories();
</script>
</body>
</html>
